services:
  postgres:
    image: postgres:16
    container_name: mandrong-postgres
    environment:
      POSTGRES_USER: mandrong
      POSTGRES_PASSWORD: mandrong
      POSTGRES_DB: mandrong
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mandrong -d mandrong"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
